profile_statement: "Golsa Ghasemi is a medical doctor and clinical researcher with experience in multidisciplinary medical research, particularly in kidney and cardiovascular diseases. She has contributed to clinical and epidemiological research projects and has published research on kidney transplantation, hemodialysis and related clinical outcomes, and acute coronary syndrome. She has experience in research methodology, data analysis, scientific writing, and manuscript preparation. Her academic interests focus on evidence-based medicine, clinical research, and improving patient outcomes through research."

